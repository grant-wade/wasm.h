name: Set up wasm-tools
description: Install the pinned native wasm-tools release and verify spectest subcommands.
inputs:
  version:
    description: wasm-tools release version
    default: '1.253.0'
runs:
  using: composite
  steps:
    - name: Install on Linux or macOS
      if: runner.os != 'Windows'
      shell: bash
      env:
        WASM_TOOLS_VERSION: ${{ inputs.version }}
      run: |
        case "$RUNNER_ARCH" in
          X64) arch=x86_64 ;;
          ARM64) arch=aarch64 ;;
          *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        case "$RUNNER_OS" in
          Linux) platform=linux ;;
          macOS) platform=macos ;;
          *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        archive="wasm-tools-${WASM_TOOLS_VERSION}-${arch}-${platform}"
        destination="$RUNNER_TEMP/wasm-tools"
        mkdir -p "$destination"
        curl --fail --location --show-error --retry 3 \
          "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${archive}.tar.gz" \
          -o "$destination/archive.tar.gz"
        tar -xzf "$destination/archive.tar.gz" -C "$destination"
        bin="$destination/$archive"
        "$bin/wasm-tools" --version
        "$bin/wasm-tools" json-from-wast --help > /dev/null
        "$bin/wasm-tools" parse --help > /dev/null
        echo "$bin" >> "$GITHUB_PATH"
    - name: Install on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        WASM_TOOLS_VERSION: ${{ inputs.version }}
      run: |
        $arch = switch ($env:RUNNER_ARCH) {
          'X64' { 'x86_64' }
          'ARM64' { 'aarch64' }
          default { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
        }
        $archive = "wasm-tools-$env:WASM_TOOLS_VERSION-$arch-windows"
        $destination = Join-Path $env:RUNNER_TEMP 'wasm-tools'
        New-Item -ItemType Directory -Force -Path $destination | Out-Null
        $zip = Join-Path $destination 'archive.zip'
        Invoke-WebRequest -Uri "https://github.com/bytecodealliance/wasm-tools/releases/download/v$env:WASM_TOOLS_VERSION/$archive.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $destination -Force
        $binaries = @(Get-ChildItem -Path $destination -Filter wasm-tools.exe -Recurse -File)
        if ($binaries.Count -ne 1) { throw 'Expected exactly one wasm-tools executable' }
        $binary = $binaries[0].FullName
        & $binary --version
        if ($LASTEXITCODE -ne 0) { throw 'wasm-tools failed to run' }
        & $binary json-from-wast --help | Out-Null
        if ($LASTEXITCODE -ne 0) { throw 'wasm-tools lacks json-from-wast' }
        & $binary parse --help | Out-Null
        if ($LASTEXITCODE -ne 0) { throw 'wasm-tools lacks parse' }
        $binaries[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
