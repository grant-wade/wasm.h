name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Superseded commits should not occupy the expanded runner matrix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check committed header matches sources
        run: |
          cc -o amalgamate tools/amalgamate.c
          ./amalgamate --check

  linux:
    name: Linux / ${{ matrix.runner }} / ${{ matrix.compiler }} / ${{ matrix.config.build_type }} / platform=${{ matrix.config.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
        compiler: [gcc, clang]
        config:
          - {build_type: Debug, platform: 'OFF', flags: '--no-platform'}
          - {build_type: Release, platform: 'ON', flags: '--release'}
        # Preserve the original platform-enabled Debug coverage too.
        include:
          - runner: ubuntu-24.04
            compiler: gcc
            config: {build_type: Debug, platform: 'ON', flags: ''}
          - runner: ubuntu-24.04
            compiler: clang
            config: {build_type: Debug, platform: 'ON', flags: ''}
    env:
      CC: ${{ matrix.compiler }}
      BUILD_FLAGS: ${{ matrix.config.flags }} --no-emcc
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl "$CC"
      - uses: ./.github/actions/setup-wasm-tools
      - name: Bootstrap the build program
        run: cc -o cbuild build.c
      - name: Build runtime, CLI, and wrapper generator
        run: ./cbuild $BUILD_FLAGS
      - name: Run native and specification tests
        run: ./cbuild $BUILD_FLAGS --test

  linux-32:
    name: Linux / x86 (32-bit) / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      BUILD_FLAGS: --release --no-emcc --cflags=-m32 --ldflags=-m32
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install multilib compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc-multilib libc6-dev-i386 clang
      # wasm-tools and the build program run on the x64 host; the runtime and tests are x86.
      - uses: ./.github/actions/setup-wasm-tools
      - name: Bootstrap the build program
        run: cc -o cbuild build.c
      - name: Build
        run: ./cbuild $BUILD_FLAGS
      - name: Execute 32-bit native and specification tests
        run: ./cbuild $BUILD_FLAGS --test

  macos:
    name: macOS / ${{ matrix.runner }} / ${{ matrix.config.build_type }} / platform=${{ matrix.config.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Unsuffixed macOS labels are native Apple Silicon; Intel is explicit.
        runner: [macos-14, macos-15, macos-26, macos-15-intel, macos-26-intel]
        config:
          - {build_type: Debug, platform: 'OFF', flags: '--no-platform'}
          - {build_type: Release, platform: 'ON', flags: '--release'}
    env:
      CC: clang
      BUILD_FLAGS: ${{ matrix.config.flags }} --no-emcc
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-wasm-tools
      - name: Bootstrap the build program
        run: cc -o cbuild build.c
      - name: Build
        run: ./cbuild $BUILD_FLAGS
      - name: Run native and specification tests
        run: ./cbuild $BUILD_FLAGS --test

  freebsd:
    name: FreeBSD / amd64 / ${{ matrix.config.build_type }} / platform=${{ matrix.config.platform }}
    runs-on: [self-hosted, freebsd, amd64]
    timeout-minutes: 30
    defaults:
      run:
        shell: sh
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        config:
          - {build_type: Debug, platform: 'OFF', flags: '--no-platform'}
          - {build_type: Debug, platform: 'ON', flags: ''}
          - {build_type: Release, platform: 'OFF', flags: '--release --no-platform'}
          - {build_type: Release, platform: 'ON', flags: '--release'}
    env:
      CC: cc
      BUILD_FLAGS: ${{ matrix.config.flags }} --no-emcc --no-zig
    steps:
      - name: Check jail tools
        run: |
          test "$(uname -s)" = FreeBSD
          test "$(uname -m)" = amd64
          cc --version
          git --version
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-wasm-tools
      - name: Check committed header and bootstrap the build program
        run: |
          cc -o amalgamate tools/amalgamate.c
          ./amalgamate --check
          cc -o cbuild build.c
      - name: Build runtime, CLI, and wrapper generator
        run: ./cbuild $BUILD_FLAGS -j2
      - name: Run native and specification tests
        run: ./cbuild $BUILD_FLAGS --test -j2 --test-timeout=300

  windows:
    name: Windows / ${{ matrix.target.runner }} / ${{ matrix.target.arch }} / ${{ matrix.config.build_type }} / platform=${{ matrix.config.platform }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - {runner: windows-2022, arch: x64, vs_arch: x64, vs_host: x64}
          - {runner: windows-2022, arch: Win32, vs_arch: x86, vs_host: x64}
          - {runner: windows-2025-vs2026, arch: x64, vs_arch: x64, vs_host: x64}
          - {runner: windows-2025-vs2026, arch: Win32, vs_arch: x86, vs_host: x64}
          - {runner: windows-11-vs2026-arm, arch: ARM64, vs_arch: arm64, vs_host: arm64}
        config:
          - {build_type: Debug, platform: 'OFF', flags: '--no-platform'}
          - {build_type: Release, platform: 'ON', flags: '--release'}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-wasm-tools
      - name: Build and run native and specification tests with MSVC
        shell: cmd
        env:
          VS_ARCH: ${{ matrix.target.vs_arch }}
          VS_HOST: ${{ matrix.target.vs_host }}
          BUILD_FLAGS: ${{ matrix.config.flags }} --no-emcc
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS_PATH=%%i"
          if not defined VS_PATH (
            echo Visual Studio was not found.
            exit /b 1
          )
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=%VS_ARCH% -host_arch=%VS_HOST%
          if errorlevel 1 exit /b 1
          cl /nologo /Fe:cbuild.exe build.c
          if errorlevel 1 exit /b 1
          cbuild.exe %BUILD_FLAGS%
          if errorlevel 1 exit /b 1
          cbuild.exe %BUILD_FLAGS% --test

  macos-preview:
    name: macOS / Xcode 27 preview / ARM64
    runs-on: xcode-27
    timeout-minutes: 30
    # Preview image availability/toolchain regressions do not block stable CI.
    continue-on-error: true
    env:
      BUILD_FLAGS: --release --no-emcc
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-wasm-tools
      - name: Bootstrap the build program
        run: cc -o cbuild build.c
      - name: Build
        run: ./cbuild $BUILD_FLAGS
      - name: Run native and specification tests
        run: ./cbuild $BUILD_FLAGS --test

  sanitizers:
    name: Sanitizers / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CC: gcc
      # build.c appends these after its own flags, so -O1 replaces the Debug default.
      CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
      LDFLAGS: -fsanitize=address,undefined
      BUILD_FLAGS: --no-werror --no-emcc
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc
      - uses: ./.github/actions/setup-wasm-tools
      - name: Bootstrap the build program
        run: cc -o cbuild build.c
      - name: Build
        run: ./cbuild $BUILD_FLAGS
      - name: Test with ASan, LSan, and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # -j bounds test parallelism too; also bound individual tests.
        run: |
          test_args=(-j2 --test-timeout=300)
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            for name in return_call return_call_indirect return_call_ref; do
              test_args+=("--test-exclude=spectest.modular.$name")
            done
          fi
          ./cbuild $BUILD_FLAGS --test "${test_args[@]}"

  fuzz-smoke:
    name: Fuzz smoke / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - uses: ./.github/actions/setup-wasm-tools
      - name: Bootstrap the build program
        run: cc -o cbuild build.c
      - name: Build and smoke-test fuzzers
        run: |
          ./cbuild --fuzzer --cc=clang -t wasm_load_fuzzer
          ./cbuild --fuzzer --cc=clang -t wasm_exec_fuzzer
          ASAN_OPTIONS=allocator_may_return_null=1:detect_leaks=1 \
            ./build/debug/wasm_load_fuzzer -runs=2000 -max_len=65536 -rss_limit_mb=2048
          mkdir -p build/exec-corpus
          for wat in test/fuzz/corpus/*.wat; do
            wasm-tools parse "$wat" -o "build/exec-corpus/$(basename "$wat" .wat).wasm"
          done
          ASAN_OPTIONS=allocator_may_return_null=1:detect_leaks=1 \
            ./build/debug/wasm_exec_fuzzer -runs=5000 -max_len=65536 -rss_limit_mb=2048 -timeout=30 build/exec-corpus

  zig:
    name: Zig 0.17 / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, freebsd]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: grant-wade/zig-setup@v1.0.1
        with:
          version: 0.17.0
          # x64 and arm64 Ubuntu runners share an OS, so the runner keeps their caches apart.
          cache-key: ${{ matrix.runner }}
      - name: Test the Zig package
        run: |
          zig build test -Dwerror=true
          zig build test -Dwerror=true -Doptimize=safe -Dplatform=false
      - name: Run the Zig package tests through the build program
        if: runner.os != 'Windows'
        run: |
          cc -o cbuild build.c
          ./cbuild --release --test --test-label=zig
      - name: Cross-compile the runtime and Zig wrapper
        if: matrix.runner == 'ubuntu-24.04'
        run: zig build cross -Dwerror=true -Doptimize=fast
